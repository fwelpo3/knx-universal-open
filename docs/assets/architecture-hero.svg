<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">KNX Universal Open engineering architecture</title><desc id="desc">A five step diagram: KNX and ETS sources, source adapters, canonical KNX model, engineering intelligence, then public SDK. Each step is connected by an arrow.</desc><defs><linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#091523"/><stop offset="1" stop-color="#15354b"/></linearGradient><linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1b364e"/><stop offset="1" stop-color="#13283c"/></linearGradient></defs><rect width="1200" height="520" rx="26" fill="url(#background)"/><g stroke="#90b8c7" stroke-width="1" opacity=".08"><path d="M0 80H1200 M0 160H1200 M0 240H1200 M0 320H1200 M0 400H1200 M0 480H1200 M100 0V520 M200 0V520 M300 0V520 M400 0V520 M500 0V520 M600 0V520 M700 0V520 M800 0V520 M900 0V520 M1000 0V520 M1100 0V520"/></g><g font-family="Arial,Helvetica,sans-serif"><text x="62" y="76" fill="#7bdce6" font-weight="700" font-size="16" letter-spacing="2.4">KNX UNIVERSAL OPEN</text><text x="62" y="125" fill="#f4f7fb" font-weight="700" font-size="37">From project data to engineering intelligence</text><text x="62" y="160" fill="#aec6d7" font-size="17">A modular, explainable architecture for KNX software developers</text></g><g fill="url(#panel)" stroke="#3c5b73" stroke-width="1.5"><rect x="42" y="214" width="202" height="153" rx="16"/><rect x="281" y="214" width="202" height="153" rx="16"/><rect x="520" y="214" width="202" height="153" rx="16"/><rect x="759" y="214" width="202" height="153" rx="16"/><rect x="998" y="214" width="160" height="153" rx="16" stroke="#e8b469"/></g><g font-family="Arial,Helvetica,sans-serif"><g fill="#efbd78" font-size="22" font-weight="700"><text x="61" y="253">01</text><text x="300" y="253">02</text><text x="539" y="253">03</text><text x="778" y="253">04</text><text x="1017" y="253">05</text></g><g fill="#f8fbfe" font-size="19" font-weight="700"><text x="61" y="295">KNX / ETS input</text><text x="300" y="295">Source adapters</text><text x="539" y="295">Canonical model</text><text x="778" y="295">Engineering</text><text x="1017" y="295">Public SDK</text></g><g fill="#b7cadb" font-size="14"><text x="61" y="325">Projects and products</text><text x="300" y="325">Parsing and mapping</text><text x="539" y="325">Devices, objects, GAs</text><text x="778" y="325">Patterns and planning</text><text x="1017" y="325">For applications</text></g></g><g stroke="#74dde6" fill="none" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><path d="M253 290h17l-7-7m7 7-7 7"/><path d="M492 290h17l-7-7m7 7-7 7"/><path d="M731 290h17l-7-7m7 7-7 7"/><path d="M970 290h17l-7-7m7 7-7 7"/></g><g font-family="Arial,Helvetica,sans-serif"><text x="62" y="428" fill="#f2f7fc" font-size="21" font-weight="700">Designed for developers</text><text x="62" y="460" fill="#b0c6d7" font-size="16">Web apps  ·  CLI tools  ·  AI agents  ·  Smart buildings  ·  Home Assistant</text><text x="62" y="490" fill="#86a4ba" font-size="13">Architecture concept — public engine release pending review</text></g></svg>